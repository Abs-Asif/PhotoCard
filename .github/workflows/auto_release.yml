name: "Auto Release on Merge"

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3.3.0
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v3.10.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2.4.2

      - name: Generate Demo Keystore and Properties
        run: |
          mkdir -p signature
          rm -f signature/reader.keystore
          keytool -genkey -v -keystore signature/reader.keystore -alias Ashinch -keyalg RSA -keysize 2048 -validity 10000 -storepass @Ash1nch -keypass @Ash1nch -dname "CN=PhotoCard, OU=PhotoCard, O=PhotoCard, L=PhotoCard, S=PhotoCard, C=US"
          echo "storePassword=@Ash1nch" > signature/keystore_release.properties
          echo "keyPassword=@Ash1nch" >> signature/keystore_release.properties
          echo "keyAlias=Ashinch" >> signature/keystore_release.properties
          echo "storeFile=../signature/reader.keystore" >> signature/keystore_release.properties

      - name: Build Release APK
        run: ./gradlew assembleGithubRelease

      - name: Copy APK to releases directory
        run: |
          mkdir -p releases
          cp app/build/outputs/apk/github/release/PhotoCard-*.apk releases/release.apk

      - name: Commit and push release.apk
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f releases/release.apk
          git commit -m "chore: auto-release APK [skip ci]" || echo "No changes to commit"
          git push origin main
